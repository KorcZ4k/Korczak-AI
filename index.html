<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#001f3d">
  <title>Korczak AI</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">Korczak AI</div>
      <button class="new-chat" id="new-chat"><span>＋</span> Novo chat <kbd>CTRL K</kbd></button>
      <div class="search"><span>⌕</span><input id="search" placeholder="Pesquisar chats"></div>

      <div class="label">CHATS</div>
      <div class="chats" id="chat-list">
        <button class="group">⌄ <span>🌎</span> Mundo Real</button>
        <button class="chat-item active"><small>001</small> Mundo 001</button>
        <button class="chat-item"><small>001</small> Nova conversa</button>
        <button class="chat-item"><small>002</small> Mundo 002</button>
        <button class="chat-item"><small>003</small> Mundo 003</button>
        <button class="chat-item"><small>004</small> Nova conversa</button>
        <button class="group">⌄ <span>✨</span> Mundo Fantasia</button>
      </div>

      <div class="bottom">
        <button><span>▤</span> Fontes</button>
        <button><span>▥</span> Memória</button>
        <button><span>⚙</span> Configurações</button>
        <div class="profile"><i>K</i><span>Korczak AI</span><b>•••</b></div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <button class="title">Nova conversa <span>⌄</span></button>
        <button class="expand">↗</button>
      </header>

      <section class="messages" id="chat">
        <div class="welcome" id="welcome-state">
          <div class="mark">K</div>
          <h1>Como posso ajudar?</h1>
          <p>Converse com a Korczak AI</p>
        </div>
      </section>

      <div class="composer-area">
        <form class="composer" id="composer">
          <textarea id="message" rows="1" placeholder="Mensagem para o Korczak AI" required></textarea>
          <div class="composer-row">
            <button class="add" type="button">＋</button>
            <span>Enter para enviar</span>
            <button class="send" id="send" type="submit">↑</button>
          </div>
        </form>
        <div class="notice"><span id="status">Online</span> · O Korczak AI pode cometer erros. Verifique informações importantes.</div>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
