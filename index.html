<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002343">
  <title>Korczak AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação">
      <button class="brand" type="button" id="brand">Korczak AI</button>

      <button class="new-chat" id="new-chat" type="button">
        <span class="icon">＋</span>
        <span>Novo chat</span>
        <kbd>CTRL K</kbd>
      </button>

      <label class="search-box">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Pesquisar chats" autocomplete="off">
      </label>

      <div class="section-title">CHATS</div>
      <div class="chat-list" id="chat-list">
        <button class="chat-group" type="button"><span>⌄</span> 🌎 Mundo Real</button>
        <button class="chat-item active" type="button"><span>001</span> Mundo 001</button>
        <button class="chat-item" type="button"><span>001</span> Nova conversa</button>
        <button class="chat-item" type="button"><span>002</span> Mundo 002</button>
        <button class="chat-item" type="button"><span>003</span> Mundo 003</button>
        <button class="chat-item" type="button"><span>004</span> Nova conversa</button>
        <button class="chat-group fantasy" type="button"><span>⌄</span> ✨ Mundo Fantasia</button>
      </div>

      <div class="sidebar-bottom">
        <button type="button" class="sidebar-action"><span>▤</span> Fontes</button>
        <button type="button" class="sidebar-action"><span>▥</span> Memória</button>
        <button type="button" class="sidebar-action"><span>⚙</span> Configurações</button>
        <div class="account">
          <span class="avatar">K</span>
          <span>Korczak AI</span>
          <button class="account-menu" type="button" aria-label="Mais opções">•••</button>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="conversation-title" type="button" id="conversation-title">
          <span>Nova conversa</span>
          <span class="chevron">⌄</span>
        </button>
        <button class="expand-button" type="button" aria-label="Expandir">↗</button>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="welcome-state" id="welcome-state">
          <div class="welcome-mark">K</div>
          <h1>Como posso ajudar?</h1>
          <p>Converse com a Korczak AI</p>
        </div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="message" rows="1" placeholder="Mensagem para o Korczak AI" autocomplete="off" required></textarea>
          <div class="composer-footer">
            <button class="attach-button" type="button" aria-label="Adicionar">＋</button>
            <span class="composer-hint">Enter para enviar</span>
            <button class="send-button" type="submit" id="send" aria-label="Enviar">↑</button>
          </div>
        </form>
        <p class="disclaimer"><span id="status">Online</span> · O Korczak AI pode cometer erros. Verifique informações importantes.</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
