name: Ollama Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ollama-runner.yml"
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

concurrency:
  group: ollama-runner
  cancel-in-progress: true

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODEL: qwen2.5:0.5b
      ENDPOINT_FILE: ollama-endpoint.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$MODEL"
          ollama run "$MODEL" "Responda apenas: OK" >/tmp/ollama-warmup.log 2>&1 || true

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public tunnel and publish endpoint
        shell: bash
        run: |
          set -euo pipefail
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:11434 >/tmp/cloudflared.log 2>&1 &
          URL=""
          for i in {1..90}; do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "Ollama endpoint: $URL"
          printf '{"url":"%s","model":"%s","updated_at":"%s"}\n' "$URL" "$MODEL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$ENDPOINT_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ENDPOINT_FILE"
          git diff --cached --quiet || git commit -m "chore: refresh Ollama endpoint"
          git push

      - name: Verify public Ollama endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="$(python - <<'PY'
          import json
          with open("ollama-endpoint.json", encoding="utf-8") as f:
              print(json.load(f)["url"].rstrip("/"))
          PY
          )"
          for i in {1..20}; do
            if curl -fsS --max-time 10 "$URL/api/tags" >/tmp/public-tags.json; then
              echo "Public Ollama endpoint is reachable"
              cat /tmp/public-tags.json
              exit 0
            fi
            sleep 3
          done
          echo "Public Ollama endpoint is not reachable"
          cat /tmp/cloudflared.log || true
          exit 1

      - name: Keep Ollama online
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..290}; do
            if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama stopped unexpectedly"
              cat /tmp/ollama.log || true
              exit 1
            fi
            if ! pgrep -f 'cloudflared tunnel' >/dev/null; then
              echo "Cloudflare tunnel stopped unexpectedly"
              cat /tmp/cloudflared.log || true
              exit 1
            fi
            sleep 60
          done
