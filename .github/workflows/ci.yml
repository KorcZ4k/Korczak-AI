name: CI

on:
  push:
    branches: [main, hardening/excellence]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q api tests

      - name: Run tests
        run: pytest -q
